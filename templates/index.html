<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Rating Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container glass-panel">
        <header>
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#FF9900" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="#FF9900" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="#FF9900" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h1>Amazon Rating Predictor</h1>
            </div>
            <p class="subtitle">Predict the star rating of a product based on its review description using our PySpark machine learning model.</p>
        </header>

        <main>
            <form id="prediction-form">
                <div class="input-group">
                    <label for="review_text">Product Review</label>
                    <textarea id="review_text" name="review_text" placeholder="Write a detailed review about the product here..." required></textarea>
                </div>
                <button type="submit" id="submit-btn" class="primary-btn">
                    <span class="btn-text">Predict Rating</span>
                    <div class="loader hidden"></div>
                </button>
            </form>

            <div id="result-section" class="result-section hidden">
                <h3>Predicted Rating</h3>
                <div class="rating-display">
                    <div class="stars-container" id="stars-container">
                        <!-- Stars will be injected here via JS -->
                    </div>
                    <div class="rating-value">
                        <span id="rating-number">0.0</span> / 5.0
                    </div>
                </div>
            </div>
            
            <div id="error-section" class="error-section hidden">
                <p id="error-message"></p>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('prediction-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const reviewText = document.getElementById('review_text').value.trim();
            if (!reviewText) return;

            // UI Elements
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.querySelector('.btn-text');
            const loader = document.querySelector('.loader');
            const resultSection = document.getElementById('result-section');
            const errorSection = document.getElementById('error-section');
            const starsContainer = document.getElementById('stars-container');
            const ratingNumber = document.getElementById('rating-number');

            // Loading state
            submitBtn.disabled = true;
            btnText.textContent = 'Predicting...';
            loader.classList.remove('hidden');
            resultSection.classList.add('hidden');
            errorSection.classList.add('hidden');

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ review_text: reviewText })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    const rating = data.prediction;
                    ratingNumber.textContent = rating.toFixed(1);
                    
                    // Generate stars
                    starsContainer.innerHTML = '';
                    for (let i = 1; i <= 5; i++) {
                        const star = document.createElement('div');
                        star.classList.add('star');
                        
                        if (i <= rating) {
                            star.classList.add('filled');
                        } else if (i - 0.5 <= rating) {
                            star.classList.add('half-filled');
                        }
                        
                        // Add animation delay for staggered effect
                        star.style.animationDelay = `${i * 0.1}s`;
                        
                        // SVG Star path
                        star.innerHTML = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/>
                        </svg>`;
                        
                        starsContainer.appendChild(star);
                    }
                    
                    resultSection.classList.remove('hidden');
                } else {
                    throw new Error(data.error || 'Failed to get prediction');
                }
            } catch (error) {
                document.getElementById('error-message').textContent = error.message;
                errorSection.classList.remove('hidden');
            } finally {
                // Reset loading state
                submitBtn.disabled = false;
                btnText.textContent = 'Predict Rating';
                loader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
